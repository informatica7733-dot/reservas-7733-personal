<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Escuela 7733</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="logo-7733.png" alt="Logo Escuela 7733" class="logo">
    <h1>Panel de Reservas - Escuela N° 7733</h1>
  </header>

  <main>
    <!-- Formulario de reservas -->
    <h2>Reservas en Google Calendar</h2>
    <div style="text-align:center; margin-top:20px;">
      <iframe src="https://calendar.app.google/3zxcrZpGS32yd1ae9"
              style="border:0" width="100%" height="800" frameborder="0" scrolling="yes"></iframe>
    </div>

    <!-- 👉 Línea divisoria -->
    <div class="section-divider"></div>

    <!-- Vista de reservas confirmadas -->
    <h2 class="confirmadas">Reservas confirmadas</h2>
    <div style="text-align:center; margin-top:20px;">
      <iframe src="https://calendar.google.com/calendar/embed?src=aW5mb3JtYXRpY2E3NzMzQGdtYWlsLmNvbQ&ctz=America%2FArgentina%2FBuenos_Aires"
              style="border:0" width="100%" height="800" frameborder="0" scrolling="yes"></iframe>
    </div>
  </main>
</body>
</html>
