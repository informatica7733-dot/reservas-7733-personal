<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Reservas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Estilos adicionales para el dashboard */
    .tabs {
      display: flex;
      justify-content: center;
      background-color: #1565c0;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .tab:hover {
      background-color: #0d47a1;
    }

    .tab.active {
      background-color: #ffeb3b;
      color: #000;
      font-weight: bold;
    }

    .tab-content {
      display: none;
      padding: 20px;
      background-color: #f5f5f5;
      color: #000;
      border-radius: 6px;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<header>
  <img src="logo-7733.png" alt="Logo Escuela 7733">
  <h1>Dashboard de Reservas</h1>
</header>
<body>
  <div class="tabs">
    <div class="tab active" onclick="openTab('steam')">Sala STEAM</div>
    <div class="tab" onclick="openTab('biblioteca')">Biblioteca</div>
    <div class="tab" onclick="openTab('recursos')">Recursos</div>
  </div>

  <div id="steam" class="tab-content active">
    <h2>Reservar Sala STEAM</h2>
    <iframe src="steam.html" width="100%" height="600" style="border:none;"></iframe>
  </div>

  <div id="biblioteca" class="tab-content">
    <h2>Reservar Biblioteca</h2>
    <iframe src="biblioteca.html" width="100%" height="600" style="border:none;"></iframe>
  </div>

  <div id="recursos" class="tab-content">
    <h2>Reservar Recursos</h2>
    <iframe src="recursos.html" width="100%" height="600" style="border:none;"></iframe>
  </div>

  <script>
    function openTab(tabId) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

      document.querySelector(`.tab[onclick="openTab('${tabId}')"]`).classList.add("active");
      document.getElementById(tabId).classList.add("active");
    }
  </script>
</body>
