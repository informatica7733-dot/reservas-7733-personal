<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reservas Sala STEAM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<header>
  <img src="logo-7733.png" alt="Logo Escuela 7733">
  <h1>Reservar Sala STEAM</h1>
</header>
<body>
  <h1>Reservar Sala STEAM</h1>

  <label>Fecha: <input type="date" id="fecha"></label><br>
  <label>Docente: <input type="text" id="docente"></label><br>
  <label>Curso: <input type="text" id="curso"></label><br>

  <h2>Horarios disponibles</h2>
  <table id="tabla-horarios"></table>

  <h2>Reservas confirmadas</h2>
  <table border="1">
    <thead>
      <tr><th>Docente</th><th>Curso</th><th>Fecha</th><th>Horario</th></tr>
    </thead>
    <tbody id="tabla-confirmadas"></tbody>
  </table>

  <script>
    const horarios = [
      "07:45 - 08:25","08:25 - 09:05","09:15 - 09:55","09:55 - 10:35",
      "10:45 - 11:25","11:25 - 12:05","12:05 - 12:45","12:45 - 13:25",
      "13:30 - 14:10","14:10 - 14:50","15:00 - 15:40","15:40 - 16:20",
      "16:30 - 17:10","17:10 - 17:50","17:50 - 18:30","18:30 - 19:10"
    ];

    const tabla = document.getElementById("tabla-horarios");
    horarios.forEach(h => {
      const fila = document.createElement("tr");
      fila.innerHTML = `<td>${h}</td>
        <td><button onclick="reservar('${h}')">Reservar</button></td>`;
      tabla.appendChild(fila);
    });

    async function reservar(horario) {
      const fecha = document.getElementById("fecha").value;
      const docente = document.getElementById("docente").value;
      const curso = document.getElementById("curso").value;

      const res = await fetch("/reservas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          recurso: "STEAM",
          docente,
          curso,
          fecha,
          horario,
          recursos: {}
        })
      });

      if (res.ok) {
        alert("Reserva confirmada");
        cargarReservas();
      } else {
        const err = await res.json();
        alert("Error: " + err.error);
      }
    }

    async function cargarReservas() {
      const res = await fetch("/reservas?recurso=STEAM");
      const data = await res.json();
      const tbody = document.getElementById("tabla-confirmadas");
      tbody.innerHTML = "";
      data.forEach(r => {
        tbody.innerHTML += `<tr>
          <td>${r.docente}</td>
          <td>${r.curso}</td>
          <td>${r.fecha}</td>
          <td>${r.horario}</td>
        </tr>`;
      });
    }

    cargarReservas();
  </script>
</body>
