<div class="calendar-section">
  <div class="section-title">RESERVAS CONFIRMADAS</div>
  <ul id="listaReservasBiblioteca"></ul>
</div>

<div class="arrow-down">⬇️</div>

<!-- Calendario para generar reservas -->
<div class="calendar-section reservas-section">
  <div class="section-title">GENERAR RESERVAS</div>
  <iframe id="reservasFrame"
          src="https://calendar.app.google/G7moFnrPrqpSJYSC9"
          frameborder="0" scrolling="yes"></iframe>
</div>

<script>
  async function cargarReservasBiblioteca() {
    const response = await fetch('/api/reservas-biblioteca');
    const reservas = await response.json();
    const lista = document.getElementById('listaReservasBiblioteca');
    lista.innerHTML = '';

    reservas.forEach(evento => {
      const li = document.createElement('li');
      const inicio = new Date(evento.start.dateTime || evento.start.date);
      li.textContent = `${inicio.toLocaleString()} → ${evento.summary}`;
      lista.appendChild(li);
    });
  }

  cargarReservasBiblioteca();
  setInterval(cargarReservasBiblioteca, 30000);
</script>
