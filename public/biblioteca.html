<body>
  <h1>Reservar Biblioteca</h1>

  <label>Fecha: <input type="date" id="fecha"></label><br>
  <label>Docente: <input type="text" id="docente"></label><br>
  <label>Curso: <input type="text" id="curso"></label><br>

  <h2>Horarios disponibles</h2>
  <div id="horarios-container"></div>

  <button onclick="confirmarReserva()">Confirmar Reserva</button>

  <h2>Reservas confirmadas</h2>
  <table border="1">
    <thead>
      <tr><th>Docente</th><th>Curso</th><th>Fecha</th><th>Horario</th></tr>
    </thead>
    <tbody id="tabla-confirmadas"></tbody>
  </table>

  <script>
    const horarios = [...]; // igual que STEAM
    const cont = document.getElementById("horarios-container");
    let horarioSeleccionado = null;

    horarios.forEach(h => {
      const div = document.createElement("div");
      div.className = "horario-bloque";
      div.innerText = h;
      div.onclick = () => seleccionarHorario(div, h);
      cont.appendChild(div);
    });

    function seleccionarHorario(div, h) {
      document.querySelectorAll(".horario-bloque").forEach(el => el.classList.remove("seleccionado"));
      div.classList.add("seleccionado");
      horarioSeleccionado = h;
    }

    async function confirmarReserva() {
      const fecha = document.getElementById("fecha").value;
      const docente = document.getElementById("docente").value;
      const curso = document.getElementById("curso").value;

      if (!fecha || !docente || !curso || !horarioSeleccionado) {
        alert("Complete todos los campos y seleccione un horario.");
        return;
      }

      const res = await fetch("/reservas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          recurso: "Biblioteca", // ✅ corregido
          docente,
          curso,
          fecha,
          horario: horarioSeleccionado,
          recursos: {}
        })
      });

      if (res.ok) {
        alert("Reserva confirmada");
        cargarReservas();
      } else {
        const err = await res.json();
        alert("Error: " + err.error);
      }
    }

    async function cargarReservas() {
      const res = await fetch("/reservas?recurso=Biblioteca"); // ✅ corregido
      const data = await res.json();
      const tbody = document.getElementById("tabla-confirmadas");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4">No hay reservas confirmadas</td></tr>`;
        return;
      }

      data.forEach(r => {
        tbody.innerHTML += `<tr>
          <td>${r.docente}</td>
          <td>${r.curso}</td>
          <td>${r.fecha}</td>
          <td>${r.horario}</td>
        </tr>`;
      });
    }

    cargarReservas();
  </script>
